name: immo_mobile
description: "Mobile app for the ImmoSaaS real-estate-management platform (tenant/agent/field-manager roles)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management / routing
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.3

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utilities
  intl: ^0.20.2
  logger: ^2.5.0

  # Media / location
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  url_launcher: ^6.3.1

  # Notifications (local only in this pass - see lib/core/notifications)
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true

<app-page-header title="Biens" subtitle="Gestion du parc immobilier de l'organisation">
  <button mat-flat-button color="primary" *appHasPermission="'properties:create'" (click)="createNew()">
    <mat-icon>add</mat-icon>
    Nouveau bien
  </button>
</app-page-header>

<app-property-filters (filtersChange)="onFiltersChange($event)" />

<app-data-table
  [columns]="columns"
  [result]="store.result()"
  [loading]="store.loading()"
  [rowActions]="rowActionsRef()"
  emptyMessage="Aucun bien ne correspond à ces critères."
  (pageChange)="onPageChange($event)"
  (sortChange)="onSortChange($event)"
  (rowClick)="openDetail($event)"
/>

<ng-template #rowActionsTpl let-property>
  <button mat-icon-button matTooltip="Voir" (click)="openDetail(property)">
    <mat-icon>visibility</mat-icon>
  </button>
  <button mat-icon-button matTooltip="Modifier" *appHasPermission="'properties:update'" (click)="edit(property)">
    <mat-icon>edit</mat-icon>
  </button>
  <button mat-icon-button matTooltip="Supprimer" *appHasPermission="'properties:delete'" (click)="remove(property)">
    <mat-icon>delete</mat-icon>
  </button>
</ng-template>

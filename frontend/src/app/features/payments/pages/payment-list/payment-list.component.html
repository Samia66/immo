<app-page-header title="Paiements" subtitle="Échéances de loyer et enregistrement des règlements">
  <a mat-stroked-button routerLink="/app/payments/overdue">
    <mat-icon>warning</mat-icon>
    Impayés
  </a>
</app-page-header>

<mat-form-field appearance="outline" style="max-width: 220px; display:block; margin-bottom: 1rem;">
  <mat-label>Statut</mat-label>
  <mat-select (selectionChange)="onStatusChange($event.value)">
    <mat-option [value]="null">Tous</mat-option>
    @for (status of statuses; track status) {
      <mat-option [value]="status">{{ status }}</mat-option>
    }
  </mat-select>
</mat-form-field>

<app-data-table
  [columns]="columns"
  [result]="store.result()"
  [loading]="store.loading()"
  [rowActions]="rowActionsRef()"
  emptyMessage="Aucun paiement trouvé."
  (pageChange)="onPageChange($event)"
/>

<ng-template #rowActionsTpl let-payment>
  @if (payment.status !== PaymentStatus.PAYE && payment.status !== PaymentStatus.ANNULE) {
    <button mat-icon-button matTooltip="Enregistrer un paiement" *appHasPermission="'payments:create'" (click)="record(payment)">
      <mat-icon>payments</mat-icon>
    </button>
  }
  @if (payment.receiptUrl) {
    <button mat-icon-button matTooltip="Quittance" (click)="downloadReceipt(payment)">
      <mat-icon>receipt_long</mat-icon>
    </button>
  }
</ng-template>

<app-page-header
  title="Nouvelle demande de maintenance"
  [breadcrumbs]="[{ label: 'Maintenance', link: '/app/maintenance' }, { label: 'Nouvelle' }]"
/>

<form [formGroup]="form" (ngSubmit)="submit()" class="card">
  <div class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Bien</mat-label>
      <mat-select formControlName="propertyId" required>
        @for (property of properties(); track property.id) {
          <mat-option [value]="property.id">{{ property.title }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Catégorie</mat-label>
      <input matInput formControlName="category" placeholder="Plomberie, électricité..." required />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Priorité</mat-label>
      <mat-select formControlName="priority">
        @for (priority of priorities; track priority) {
          <mat-option [value]="priority">{{ priority }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" style="grid-column: 1 / -1;">
      <mat-label>Description</mat-label>
      <textarea matInput rows="4" formControlName="description" required></textarea>
    </mat-form-field>
  </div>

  <div class="form-actions">
    <button mat-button type="button" (click)="cancel()">Annuler</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="saving()">
      @if (saving()) {
        <mat-spinner diameter="20" />
      } @else {
        Créer la demande
      }
    </button>
  </div>
</form>

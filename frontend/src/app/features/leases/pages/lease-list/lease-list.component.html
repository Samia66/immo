<app-page-header title="Contrats" subtitle="Baux de location en cours et passés">
  <button mat-flat-button color="primary" *appHasPermission="'leases:create'" (click)="createNew()">
    <mat-icon>add</mat-icon>
    Nouveau contrat
  </button>
</app-page-header>

<mat-form-field appearance="outline" style="max-width: 220px; display:block; margin-bottom: 1rem;">
  <mat-label>Statut</mat-label>
  <mat-select (selectionChange)="onStatusChange($event.value)">
    <mat-option [value]="null">Tous</mat-option>
    @for (status of statuses; track status) {
      <mat-option [value]="status">{{ status }}</mat-option>
    }
  </mat-select>
</mat-form-field>

<app-data-table
  [columns]="columns"
  [result]="store.result()"
  [loading]="store.loading()"
  [rowActions]="rowActionsRef()"
  emptyMessage="Aucun contrat trouvé."
  (pageChange)="onPageChange($event)"
  (rowClick)="openDetail($event)"
/>

<ng-template #rowActionsTpl let-lease>
  <button mat-icon-button matTooltip="Voir" (click)="openDetail(lease)">
    <mat-icon>visibility</mat-icon>
  </button>
</ng-template>

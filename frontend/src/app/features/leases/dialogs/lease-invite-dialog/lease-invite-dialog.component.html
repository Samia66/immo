<h2 mat-dialog-title>Invitation du locataire</h2>
<mat-dialog-content>
  <p>
    Communiquez ce code au locataire pour qu'il active son compte sur l'application mobile.
    Il expire le {{ data.expiresAt | date: 'dd/MM/yyyy à HH:mm' }}.
  </p>
  <mat-form-field appearance="outline" style="width: 100%;">
    <mat-label>Code d'activation</mat-label>
    <input matInput [value]="data.code" readonly />
    <button mat-icon-button matSuffix type="button" (click)="copyCode()" aria-label="Copier le code">
      <mat-icon>content_copy</mat-icon>
    </button>
  </mat-form-field>

  <mat-form-field appearance="outline" style="width: 100%;">
    <mat-label>Message à partager</mat-label>
    <textarea matInput [value]="data.shareMessage" readonly rows="2"></textarea>
    <button mat-icon-button matSuffix type="button" (click)="copyMessage()" aria-label="Copier le message">
      <mat-icon>content_copy</mat-icon>
    </button>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-flat-button color="primary" (click)="close()">Fermer</button>
</mat-dialog-actions>

<app-page-header
  title="Détail organisation"
  [breadcrumbs]="[{ label: 'Organisations', link: '/super-admin/organizations' }, { label: 'Détail' }]"
/>

@if (loading()) {
  <div style="display:flex; justify-content:center; padding: 3rem;">
    <mat-spinner diameter="32" />
  </div>
} @else {
  <div class="card" style="margin-bottom: 1rem;">
    <mat-form-field appearance="outline" style="max-width: 260px;">
      <mat-label>Plan d'abonnement</mat-label>
      <mat-select [value]="subscriptionPlan()" (selectionChange)="changePlan($event.value)">
        @for (plan of plans; track plan) {
          <mat-option [value]="plan">{{ plan }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="card">
    <div class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>Nom</mat-label>
        <input matInput formControlName="name" required />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Téléphone</mat-label>
        <input matInput formControlName="phone" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Adresse</mat-label>
        <input matInput formControlName="address" />
      </mat-form-field>
    </div>
    <div class="form-actions">
      <button mat-flat-button color="primary" type="submit" [disabled]="saving()">
        @if (saving()) {
          <mat-spinner diameter="20" />
        } @else {
          Enregistrer
        }
      </button>
    </div>
  </form>
}
